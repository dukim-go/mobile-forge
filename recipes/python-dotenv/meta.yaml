package:
  name: python-dotenv
  version: 1.0.1

source:
  url: https://pypi.org/packages/source/p/python-dotenv/python-dotenv-1.0.1.tar.gz
  sha256: 1c2c0c8c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python
    - pip
  run:
    - python

test:
  imports:
    - dotenv
  commands:
    - python -c "import dotenv; print(dotenv.__version__)" 